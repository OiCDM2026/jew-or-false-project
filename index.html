<style>
  /* Self-hosted rather than Google Fonts: Google always serves Fraunces

    font-family: 'Fraunces';
    src: url('fonts/Fraunces-Variable.woff2') format('woff2-variations'),
         url('fonts/Fraunces-Variable.woff2') format('woff2');

    --color-bg-alt: #ECE3D2;
    --color-card: #FFFFFF;
    --color-ink: #262220;
    --color-ink-soft: #6b6259;
    --color-border: #E1D6C2;
    --color-primary: #2C4A6E;
    --color-primary-ink: #FFFFFF;
    --color-gold: #A9781F;

  @media (prefers-color-scheme: dark) {

      --color-border: #33373F;
      --color-primary: #6E93BE;
      --color-primary-ink: #12181F;
      --color-gold: #D6AA4E;
      --color-true: #9CBB78;

  :root[data-theme="dark"] {

  .stats-row {

  .score-chart-bars {

  .review-list { margin-top: 4px; }

  .share-btn {

</style>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div>
        <h1><span class="j-wrap">J<svg class="kippah" viewBox="0 0 32 20" aria-hidden="true"><path d="M2,18 A14,16 0 0 1 30,18 Z" fill="var(--color-primary)" stroke="var(--color-gold)" stroke-width="1.5"/><ellipse cx="13" cy="9" rx="5" ry="3" fill="#ffffff" opacity="0.18"/></svg></span>ew or False</h1>
        <p class="tagline">Five statements. True or fabricated?</p>
      </div>
    </div>
    <div class="streak-badge" id="streakBadge">0 day streak</div>
  </header>
  <main id="gameArea"></main>
  <footer>
    <p>A new set of five, every day.</p>
  </footer>
</div>

<script>
let STATEMENTS = [];
let FESTIVALS = [];

const STORAGE_KEY = 'jew-or-false-stats-v1';
const EPOCH = new Date('2026-09-22T00:00:00Z'); // launch day = Puzzle #1

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function dateFromKey(k) {
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function keyFromDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function addDays(d, n) {
  const copy = new Date(d);
  copy.setDate(copy.getDate() + n);
  return copy;
}

// Festivals block the whole calendar day. Data comes from festivals.json
// (major Yom Tov days, diaspora two-day schedule) via the Hebcal API.
function findFestivalForKey(k) {
  return FESTIVALS.find(f => k >= f.start && k <= f.end) || null;
}

function isSaturdayKey(k) {
  return dateFromKey(k).getDay() === 6;
}

// A date counts as "closed" for streak purposes if it's a festival day or
// a Saturday (Shabbat) — both are days the site intentionally has no game,
// so missing one shouldn't break a streak.
function isClosedDateForStreak(k) {
  return !!findFestivalForKey(k) || isSaturdayKey(k);
}

// Walks backward from (but not including) today, skipping closed dates,
// to find the most recent day the game was actually playable.
function lastOpenDayBefore(todayKeyStr) {
  let d = dateFromKey(todayKeyStr);
  for (let i = 0; i < 400; i++) {
    d = addDays(d, -1);
    const k = keyFromDate(d);
    if (!isClosedDateForStreak(k)) return k;
  }
  return null;
}

// Shabbat break is a real-time window (not a full closed calendar date),
// approximated with a fixed local-clock window rather than true sunset/
// nightfall, which vary by location and season.
const SHABBAT_BREAK_START_HOUR = 18; // Friday, approx candle-lighting
const SHABBAT_BREAK_END_HOUR = 20;   // Saturday, approx Havdalah
function isShabbatBreakNow() {
  const now = new Date();
  const dow = now.getDay();
  const hour = now.getHours();
  if (dow === 5 && hour >= SHABBAT_BREAK_START_HOUR) return true;
  if (dow === 6 && hour < SHABBAT_BREAK_END_HOUR) return true;
  return false;
}

function dayNumberForKey(k) {
  const [y, m, dd] = k.split('-').map(Number);
  const utcDay = Date.UTC(y, m - 1, dd);
  const diff = Math.floor((utcDay - EPOCH.getTime()) / 86400000);
  return diff + 1;
}

function dayNumber() {
  return dayNumberForKey(todayKey());
}

function seedFromDateKey(key) {
  let h = 0;
  for (let i = 0; i < key.length; i++) {
    h = (h * 31 + key.charCodeAt(i)) >>> 0;
  }
  return h;
}

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffleWithRng(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const NO_REPEAT_DAYS = 30;

// A statement's "group" is its pair (true+false share one underlying fact),
// or its own id for the handful of legacy standalone statements with no
// pairId — those must never be treated as interchangeable with each other.
function statementGroupKey(s) {
  return s.pairId != null ? ('p' + s.pairId) : ('s' + s.id);
}

// Deterministically replays every day since launch (EPOCH) to build up which
// statement-groups were shown in the trailing NO_REPEAT_DAYS window, so
// today's picks can avoid repeating anything from the last month. This is a
// pure function of the current STATEMENTS array and today's date — nothing
// is stored server-side. Cheap even over years of daily replay (a handful of
// array shuffles per simulated day).
function getTodaysStatements() {
  const byCategory = {};
  STATEMENTS.forEach(s => {
    (byCategory[s.category] = byCategory[s.category] || []).push(s);
  });

  const totalDays = dayNumberForKey(todayKey());
  const history = []; // oldest -> newest, each entry: array of group keys shown that day
  let cursor = new Date(EPOCH);
  let todaysPicks = [];

  for (let dayIdx = 1; dayIdx <= totalDays; dayIdx++) {
    const dKey = keyFromDate(cursor);
    const rng = mulberry32(seedFromDateKey(dKey));

    const excluded = new Set();
    const windowStart = Math.max(0, history.length - NO_REPEAT_DAYS);
    for (let i = windowStart; i < history.length; i++) {
      history[i].forEach(gk => excluded.add(gk));
    }

    const categories = shuffleWithRng(Object.keys(byCategory), rng);
    const picked = [];
    const usedToday = new Set();

    for (const cat of categories) {
      if (picked.length >= 5) break;
      const pool = shuffleWithRng(byCategory[cat], rng);
      const choice = pool.find(s => !excluded.has(statementGroupKey(s)) && !usedToday.has(statementGroupKey(s)));
      if (!choice) continue; // nothing fresh in this category right now — skip it, try another
      picked.push(choice);
      usedToday.add(statementGroupKey(choice));
    }

    // Fallback (only matters for a very small bank): if categories ran out
    // of 30-day-fresh options before reaching 5, relax to "not already
    // picked today" so the game never breaks.
    if (picked.length < 5) {
      for (const cat of categories) {
        if (picked.length >= 5) break;
        const pool = shuffleWithRng(byCategory[cat], rng);
        const choice = pool.find(s => !usedToday.has(statementGroupKey(s)));
        if (choice) { picked.push(choice); usedToday.add(statementGroupKey(choice)); }
      }
    }

    history.push(picked.map(statementGroupKey));
    todaysPicks = picked;
    cursor = addDays(cursor, 1);
  }

  return todaysPicks;
}

function loadStats() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { currentStreak: 0, maxStreak: 0, played: 0, totalCorrect: 0, lastPlayedDate: null, history: {} };
    return JSON.parse(raw);
  } catch (e) {
    return { currentStreak: 0, maxStreak: 0, played: 0, totalCorrect: 0, lastPlayedDate: null, history: {} };
  }
}

function saveStats(stats) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); } catch (e) {}
}

let stats = loadStats();
const gameArea = document.getElementById('gameArea');
const streakBadge = document.getElementById('streakBadge');

function updateStreakBadge() {
  const n = stats.currentStreak;
  streakBadge.textContent = n === 1 ? '1 day streak' : n + ' day streak';
}
updateStreakBadge();

const key = todayKey();
const puzzleNum = dayNumber();
let todaysStatements = [];

let currentIndex = 0;
let answers = [];

function renderProgress() {
  const dots = [];
  for (let i = 0; i < 5; i++) {
    let cls = 'dot';
    if (i < currentIndex) cls += ' filled';
    dots.push('<div class="' + cls + '"></div>');
  }
  return '<div class="progress">' + dots.join('') + '</div>';
}

function renderQuestion() {
  const s = todaysStatements[currentIndex];
  gameArea.innerHTML =
    renderProgress() +
    '<div class="card">' +
      '<p class="eyebrow">Statement ' + (currentIndex + 1) + ' of 5</p>' +
      '<p class="statement">' + s.statement + '</p>' +
      '<div class="choices">' +
        '<button class="choice-btn jew" id="btnJew">Jew</button>' +
        '<button class="choice-btn false" id="btnFalse">False</button>' +
      '</div>' +
      '<div id="feedbackSlot"></div>' +
    '</div>';

  document.getElementById('btnJew').addEventListener('click', () => handleAnswer(true, s));
  document.getElementById('btnFalse').addEventListener('click', () => handleAnswer(false, s));
}

function handleAnswer(pickedTrue, s) {
  const correct = pickedTrue === s.isTrue;
  answers.push({ statement: s.statement, isTrue: s.isTrue, picked: pickedTrue, correct: correct, explanation: s.explanation });

  const jewBtn = document.getElementById('btnJew');
  const falseBtn = document.getElementById('btnFalse');
  jewBtn.disabled = true;
  falseBtn.disabled = true;

  const correctBtn = s.isTrue ? jewBtn : falseBtn;
  const pickedBtn = pickedTrue ? jewBtn : falseBtn;

  correctBtn.classList.add('reveal-correct');
  if (pickedBtn !== correctBtn) {
    pickedBtn.classList.add('picked');
  } else {
    pickedBtn.classList.add('picked');
  }
  [jewBtn, falseBtn].forEach(b => { if (!b.classList.contains('picked') && !b.classList.contains('reveal-correct')) b.classList.add('dim'); });

  const slot = document.getElementById('feedbackSlot');
  slot.innerHTML =
    '<div class="feedback">' +
      '<p class="feedback-verdict ' + (correct ? 'correct' : 'incorrect') + '">' + (correct ? 'Correct.' : 'Not quite.') + '</p>' +
      '<p class="feedback-explanation">' + s.explanation + '</p>' +
      '<button class="next-btn" id="nextBtn">' + (currentIndex < 4 ? 'Next statement' : 'See results') + '</button>' +
    '</div>';

  document.getElementById('nextBtn').addEventListener('click', () => {
    currentIndex++;
    if (currentIndex < 5) {
      renderQuestion();
    } else {
      finishGame();
    }
  });
}

function finishGame() {
  const score = answers.filter(a => a.correct).length;

  const continuesStreak = stats.lastPlayedDate === lastOpenDayBefore(key);
  const alreadyToday = stats.lastPlayedDate === key;
  let submitPromise = null;
  if (!alreadyToday) {
    stats.currentStreak = continuesStreak ? stats.currentStreak + 1 : 1;
    stats.maxStreak = Math.max(stats.maxStreak, stats.currentStreak);
    stats.played += 1;
    stats.totalCorrect += score;
    stats.lastPlayedDate = key;
    stats.history[key] = { score, answers };
    saveStats(stats);
    submitPromise = submitScore(key, score);
  }
  updateStreakBadge();
  // Score/results render immediately (no waiting); only the chart, further
  // down, waits on submitPromise so it never undercounts the player's own
  // just-submitted score against a race with their own request.
  renderResults(score, answers, submitPromise);
}

function submitScore(dateKey, scoreVal) {
  return fetch('/api/submit-score', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ date: dateKey, score: scoreVal }),
  }).catch(() => {});
}

const RESULT_MESSAGES = {
  0: ['Oy vey.', 'Oy gevalt — not your day.', 'Zero for five. Even a coin flip does better.', 'Rock bottom. Onward and upward.'],
  1: ['Oy vey, rough one.', "One's still one — progress, sort of.", 'A single bright spot in there.', 'Could be worse. Could always be worse.'],
  2: ["A coin flip would've done as well.", 'The statements won this round.', 'Room to learn something new.', 'Halfway to halfway there.'],
  3: ['Solid instincts.', "More right than wrong — we'll take it.", 'A respectable showing.', 'Middle of the pack, and proud of it.'],
  4: ['So close to perfect!', 'One away from a clean sweep.', 'Sharp instincts today.', 'Kol hakavod — nearly flawless.'],
  5: ['Mazel tov! Perfect set.', 'Shkoyach — a perfect five.', 'Kol hakavod, perfect score!', 'Flawless. Take a bow.'],
};

function resultMessage(score) {
  const pool = RESULT_MESSAGES[score];
  const rng = mulberry32(seedFromDateKey(key + '-msg'));
  return pool[Math.floor(rng() * pool.length)];
}

function buildShareText(score, answersArr) {
  const grid = answersArr.map(a => a.correct ? '\u{1F7E9}' : '\u{1F7E5}').join('');
  return 'Jew or False #' + puzzleNum + ' — ' + score + '/5\n' + grid + '\nhttps://jew-or-false.com';
}

function renderResults(score, answersArr, submitPromise) {
  const grid = answersArr.map(a => a.correct ? '🟩' : '🟥').join(' ');
  const avg = stats.played > 0 ? Math.round((stats.totalCorrect / (stats.played * 5)) * 100) : 0;

  const reviewHtml = answersArr.map(a => {
    const mark = a.correct ? '🟩' : '🟥';
    const answerLabel = a.isTrue ? 'True' : 'False';
    return '<div class="review-item">' +
      '<span class="review-mark">' + mark + '</span>' +
      '<div class="review-text">' +
        '<div class="review-statement">' + a.statement + '</div>' +
        '<div class="review-answer">Answer: ' + answerLabel + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  gameArea.innerHTML =
    '<div class="card">' +
      '<p class="eyebrow">Puzzle #' + puzzleNum + '</p>' +
      '<div class="results-score">' +
        '<div class="big-number">' + score + '/5</div>' +
        '<div class="of-five">' + resultMessage(score) + '</div>' +
      '</div>' +
      '<div class="emoji-grid">' + grid + '</div>' +
      '<div class="stats-row">' +
        '<div class="stat"><div class="num">' + stats.currentStreak + '</div><div class="label">Streak</div></div>' +
        '<div class="stat"><div class="num">' + avg + '%</div><div class="label">Accuracy</div></div>' +
      '</div>' +
      '<div id="scoreChartSlot"></div>' +
      '<button class="share-btn" id="shareBtn">Copy result to share</button>' +
      '<div class="copied-note" id="copiedNote"></div>' +
      '<div class="review-list">' + reviewHtml + '</div>' +
      '<a class="beigel-link" href="https://buymeacoffee.com/jeworfalse" target="_blank" rel="noopener">Help my beigel fund 🥯</a>' +
    '</div>';

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const text = buildShareText(score, answersArr).replace(/\\n/g, '\n');
    try {
      await navigator.clipboard.writeText(text);
      document.getElementById('copiedNote').textContent = 'Copied to clipboard.';
    } catch (e) {
      document.getElementById('copiedNote').textContent = text;
    }
  });

  loadAndRenderChart(key, score, submitPromise);
}

async function loadAndRenderChart(dateKey, myScore, submitPromise) {
  const slot = document.getElementById('scoreChartSlot');
  if (!slot) return;
  try {
    // Wait for this player's own score to actually land before reading the
    // distribution, otherwise a fast GET can race the POST and undercount
    // (e.g. showing "you're the first" when someone else already played).
    if (submitPromise) await submitPromise;
    const res = await fetch('/api/distribution?date=' + encodeURIComponent(dateKey), { cache: 'no-store' });
    if (!res.ok) throw new Error('bad response');
    const { counts, total } = await res.json();
    slot.innerHTML = renderScoreChartHtml(counts, total, myScore);
  } catch (e) {
    slot.innerHTML = ''; // no backend available (e.g. local static preview) — fail silently
  }
}

function percentileMessage(counts, total, myScore) {
  if (total <= 1) return "You're the first to play today!";
  let scoredLess = 0;
  for (let s = 0; s < myScore; s++) scoredLess += counts[s] || 0;
  const pct = Math.round((scoredLess / total) * 100);
  return 'You scored better than ' + pct + '% of today\'s players.';
}

function renderScoreChartHtml(counts, total, myScore) {
  const max = Math.max(1, ...[0, 1, 2, 3, 4, 5].map(s => counts[s] || 0));
  const bars = [0, 1, 2, 3, 4, 5].map(s => {
    const c = counts[s] || 0;
    const pct = total > 0 ? Math.round((c / total) * 100) : 0;
    const heightPct = Math.max(Math.round((c / max) * 100), 3);
    const mineClass = s === myScore ? ' mine' : '';
    return (
      '<div class="score-chart-col">' +
        '<div class="score-chart-pct">' + pct + '%</div>' +
        '<div class="score-chart-bar' + mineClass + '" style="height:' + heightPct + '%"></div>' +
        '<div class="score-chart-label">' + s + '</div>' +
      '</div>'
    );
  }).join('');
  const countLabel = total > 0 ? ' (' + total + (total === 1 ? ' player' : ' players') + ')' : '';
  return (
    '<div class="score-chart">' +
      '<p class="score-chart-headline">' + percentileMessage(counts, total, myScore) + '</p>' +
      '<p class="score-chart-title">How everyone scored today' + countLabel + '</p>' +
      '<div class="score-chart-bars">' + bars + '</div>' +
    '</div>'
  );
}

function renderLoading() {
  gameArea.innerHTML = '<div class="card"><p class="eyebrow">Loading today\'s statements&hellip;</p></div>';
}

function formatBackDate(k) {
  return dateFromKey(k).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}

function renderFestivalClosed(festival) {
  const backKey = keyFromDate(addDays(dateFromKey(festival.end), 1));
  gameArea.innerHTML =
    '<div class="card">' +
      '<p class="eyebrow">Chag Sameach</p>' +
      '<p class="statement">It\'s ' + festival.name + ' — a day of rest, so there\'s no puzzle today.</p>' +
      '<div class="stats-row">' +
        '<div class="stat"><div class="num">' + stats.currentStreak + '</div><div class="label">Streak (safe)</div></div>' +
      '</div>' +
      '<div class="copied-note" style="height:auto;">Back ' + formatBackDate(backKey) + '.</div>' +
    '</div>';
}

function renderShabbatBreak() {
  gameArea.innerHTML =
    '<div class="card">' +
      '<p class="eyebrow">Shabbat Shalom</p>' +
      '<p class="statement">The site is taking a break for Shabbat — no puzzle until after Havdalah.</p>' +
      '<div class="stats-row">' +
        '<div class="stat"><div class="num">' + stats.currentStreak + '</div><div class="label">Streak (safe)</div></div>' +
      '</div>' +
    '</div>';
}

function renderLoadError() {
  gameArea.innerHTML =
    '<div class="card">' +
      '<p class="eyebrow">Something went wrong</p>' +
      '<p class="statement">Couldn\'t load today\'s statements. Check your connection and try again.</p>' +
      '<button class="primary-btn" id="retryBtn">Retry</button>' +
    '</div>';
  document.getElementById('retryBtn').addEventListener('click', init);
}

async function init() {
  renderLoading();
  try {
    const res = await fetch('festivals.json');
    if (!res.ok) throw new Error('Failed to fetch festivals.json: ' + res.status);
    FESTIVALS = await res.json();
  } catch (e) {
    FESTIVALS = []; // fail open: don't block the game over a festival-data hiccup
  }

  const festival = findFestivalForKey(key);
  if (festival) {
    renderFestivalClosed(festival);
    return;
  }
  if (isShabbatBreakNow()) {
    renderShabbatBreak();
    return;
  }

  try {
    const res = await fetch('statements.json');
    if (!res.ok) throw new Error('Failed to fetch statements.json: ' + res.status);
    STATEMENTS = await res.json();
  } catch (e) {
    renderLoadError();
    return;
  }

  todaysStatements = getTodaysStatements();

  const alreadyToday = stats.lastPlayedDate === key;
  if (alreadyToday && stats.history[key]) {
    const entry = stats.history[key];
    renderResults(entry.score, entry.answers);
  } else {
    renderQuestion();
  }
}

init();
</script>
